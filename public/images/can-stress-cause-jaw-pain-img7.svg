<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <rect width="1000" height="450" fill="#f8fafc" rx="16"/>
  <text x="500" y="40" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="22" font-weight="800">The Science: How Stress Activates Jaw Muscles</text>
  <!-- Brain section -->
  <rect x="50" y="65" width="280" height="160" rx="14" fill="#fff" stroke="#c084fc" stroke-width="2"/>
  <text x="190" y="95" text-anchor="middle" fill="#7c3aed" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Amygdala</text>
  <text x="190" y="120" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Detects threat signals</text>
  <text x="190" y="142" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Activates HPA axis</text>
  <text x="190" y="164" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Triggers fight-or-flight</text>
  <text x="190" y="200" text-anchor="middle" fill="#7c3aed" font-family="system-ui,sans-serif" font-size="28">&#x1F9E0;</text>
  <!-- Arrow -->
  <path d="M340,145 L390,145" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="390,140 400,145 390,150" fill="#7c3aed"/>
  <!-- Hormones -->
  <rect x="400" y="65" width="200" height="160" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Stress Hormones</text>
  <text x="500" y="125" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="13">Cortisol &#x2191;</text>
  <text x="500" y="150" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="13">Adrenaline &#x2191;</text>
  <text x="500" y="175" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="13">Norepinephrine &#x2191;</text>
  <text x="500" y="205" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="24">&#x26A1;</text>
  <!-- Arrow -->
  <path d="M610,145 L660,145" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="660,140 670,145 660,150" fill="#f59e0b"/>
  <!-- Muscles -->
  <rect x="670" y="65" width="280" height="160" rx="14" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <text x="810" y="95" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Jaw Muscles</text>
  <text x="810" y="120" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Masseter contracts</text>
  <text x="810" y="142" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Temporalis tightens</text>
  <text x="810" y="164" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Pterygoids spasm</text>
  <text x="810" y="200" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="28">&#x1F4AA;</text>
  <!-- Key facts -->
  <rect x="50" y="260" width="430" height="160" rx="14" fill="#0f766e" opacity="0.95"/>
  <text x="265" y="295" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Key Research Findings</text>
  <text x="80" y="325" fill="#ccfbf1" font-family="system-ui,sans-serif" font-size="13">&#x2022; Masseter is strongest muscle per weight in the body</text>
  <text x="80" y="350" fill="#ccfbf1" font-family="system-ui,sans-serif" font-size="13">&#x2022; Stress can increase jaw muscle activity by 300%</text>
  <text x="80" y="375" fill="#ccfbf1" font-family="system-ui,sans-serif" font-size="13">&#x2022; Chronic stress keeps muscles contracted for hours</text>
  <text x="80" y="400" fill="#ccfbf1" font-family="system-ui,sans-serif" font-size="13">&#x2022; Sleep bruxism generates 250+ PSI bite force</text>
  <rect x="520" y="260" width="430" height="160" rx="14" fill="#1e293b" opacity="0.95"/>
  <text x="735" y="295" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">The Vicious Cycle</text>
  <text x="735" y="330" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Stress &#x2192; Clenching &#x2192; Pain</text>
  <text x="735" y="358" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">&#x2191;                              &#x2193;</text>
  <text x="735" y="386" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">More Stress &#x2190; Poor Sleep</text>
  <text x="735" y="410" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">Source: Journal of Oral Rehabilitation, 2024</text>
</svg>