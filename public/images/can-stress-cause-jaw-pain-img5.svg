<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <rect width="1000" height="500" fill="#f8fafc" rx="16"/>
  <text x="500" y="45" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="24" font-weight="800">When Stress Jaw Pain Requires Professional Help</text>
  <!-- Warning signs -->
  <rect x="40" y="75" width="440" height="390" rx="14" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <rect x="40" y="75" width="440" height="44" rx="14" fill="#ef4444"/>
  <text x="260" y="104" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">See a Doctor Immediately</text>
  <text x="75" y="150" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x26A0; Jaw locked open or closed</text>
  <text x="75" y="180" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x26A0; Sudden change in bite alignment</text>
  <text x="75" y="210" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x26A0; Severe pain with fever or swelling</text>
  <text x="75" y="240" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x26A0; Pain after jaw injury or trauma</text>
  <text x="75" y="270" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x26A0; Numbness or tingling in face</text>
  <text x="75" y="300" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x26A0; Difficulty breathing or swallowing</text>
  <rect x="75" y="330" width="370" height="50" rx="8" fill="#fef2f2"/>
  <text x="260" y="352" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Less than 5% of TMJ cases require surgery</text>
  <text x="260" y="370" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="11">Source: National Institutes of Health</text>
  <!-- Self-care appropriate -->
  <rect x="520" y="75" width="440" height="390" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <rect x="520" y="75" width="440" height="44" rx="14" fill="#16a34a"/>
  <text x="740" y="104" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Self-Care May Be Enough</text>
  <text x="555" y="150" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x2705; Mild to moderate jaw soreness</text>
  <text x="555" y="180" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x2705; Symptoms linked to stressful periods</text>
  <text x="555" y="210" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x2705; Occasional clicking without pain</text>
  <text x="555" y="240" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x2705; Morning jaw stiffness that eases</text>
  <text x="555" y="270" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x2705; Tension headaches with jaw tightness</text>
  <text x="555" y="300" fill="#1e293b" font-family="system-ui,sans-serif" font-size="14">&#x2705; Symptoms improve with relaxation</text>
  <rect x="555" y="330" width="370" height="50" rx="8" fill="#f0fdf4"/>
  <text x="740" y="352" text-anchor="middle" fill="#16a34a" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Most stress-related TMJ responds to</text>
  <text x="740" y="370" text-anchor="middle" fill="#16a34a" font-family="system-ui,sans-serif" font-size="11">conservative self-care within 2-6 weeks</text>
</svg>