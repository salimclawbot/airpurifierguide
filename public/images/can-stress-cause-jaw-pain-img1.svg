<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bg1)" rx="16"/>
  <text x="500" y="50" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="26" font-weight="800">The Stress-Jaw Pain Pathway</text>
  <!-- Step 1 -->
  <rect x="60" y="90" width="200" height="120" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="160" y="120" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="14" font-weight="700">1. STRESS TRIGGER</text>
  <text x="160" y="145" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Work, anxiety, trauma</text>
  <text x="160" y="165" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">emotional pressure</text>
  <text x="160" y="195" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="28">&#x1F627;</text>
  <!-- Arrow -->
  <path d="M270,150 L310,150" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow1)"/>
  <defs><marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0f766e"/></marker></defs>
  <!-- Step 2 -->
  <rect x="320" y="90" width="200" height="120" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="420" y="120" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="14" font-weight="700">2. FIGHT-OR-FLIGHT</text>
  <text x="420" y="145" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Cortisol + adrenaline</text>
  <text x="420" y="165" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">surge activates muscles</text>
  <text x="420" y="195" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="28">&#x26A1;</text>
  <!-- Arrow -->
  <path d="M530,150 L570,150" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow1)"/>
  <!-- Step 3 -->
  <rect x="580" y="90" width="200" height="120" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="680" y="120" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="14" font-weight="700">3. JAW CLENCHING</text>
  <text x="680" y="145" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Masseter + temporalis</text>
  <text x="680" y="165" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">contract involuntarily</text>
  <text x="680" y="195" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="28">&#x1F9B7;</text>
  <!-- Arrow down -->
  <path d="M680,220 L680,260" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow1)"/>
  <!-- Step 4 -->
  <rect x="580" y="270" width="200" height="120" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="300" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="14" font-weight="700">4. TMJ PAIN</text>
  <text x="680" y="325" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">Joint inflammation</text>
  <text x="680" y="345" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="12">muscle fatigue, headaches</text>
  <text x="680" y="375" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="28">&#x1F915;</text>
  <!-- Stats boxes -->
  <rect x="60" y="430" width="270" height="130" rx="12" fill="#0f766e" opacity="0.9"/>
  <text x="195" y="470" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="42" font-weight="800">70%</text>
  <text x="195" y="500" text-anchor="middle" fill="#99f6e4" font-family="system-ui,sans-serif" font-size="14">of TMJ cases are linked</text>
  <text x="195" y="520" text-anchor="middle" fill="#99f6e4" font-family="system-ui,sans-serif" font-size="14">to stress and anxiety</text>
  <text x="195" y="545" text-anchor="middle" fill="#5eead4" font-family="system-ui,sans-serif" font-size="10">Source: Journal of Oral Rehabilitation</text>
  <rect x="365" y="430" width="270" height="130" rx="12" fill="#1e293b" opacity="0.9"/>
  <text x="500" y="470" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="42" font-weight="800">250 PSI</text>
  <text x="500" y="500" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">force generated by</text>
  <text x="500" y="520" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">nocturnal bruxism</text>
  <text x="500" y="545" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Source: ADA Research</text>
  <rect x="670" y="430" width="270" height="130" rx="12" fill="#7c3aed" opacity="0.9"/>
  <text x="805" y="470" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="42" font-weight="800">2x</text>
  <text x="805" y="500" text-anchor="middle" fill="#e9d5ff" font-family="system-ui,sans-serif" font-size="14">women are twice as</text>
  <text x="805" y="520" text-anchor="middle" fill="#e9d5ff" font-family="system-ui,sans-serif" font-size="14">likely to develop TMD</text>
  <text x="805" y="545" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="10">Source: NIDCR / NIH</text>
</svg>