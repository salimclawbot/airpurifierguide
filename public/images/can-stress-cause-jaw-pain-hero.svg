<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0abfc"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Brain silhouette -->
  <ellipse cx="600" cy="250" rx="140" ry="120" fill="url(#brain)" opacity="0.15"/>
  <ellipse cx="560" cy="230" rx="90" ry="80" fill="url(#brain)" opacity="0.2"/>
  <ellipse cx="640" cy="230" rx="90" ry="80" fill="url(#brain)" opacity="0.2"/>
  <!-- Stress zigzag lines -->
  <polyline points="380,180 400,160 420,200 440,150 460,190 480,155" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.6"/>
  <polyline points="720,180 740,160 760,200 780,150 800,190 820,155" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Jaw outline -->
  <path d="M520,330 Q530,380 560,410 Q600,440 640,410 Q670,380 680,330" stroke="#5eead4" stroke-width="4" fill="none" opacity="0.7"/>
  <!-- Connection arrows brain to jaw -->
  <line x1="570" y1="310" x2="550" y2="350" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="630" y1="310" x2="650" y2="350" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="600" y1="320" x2="600" y2="360" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
  <!-- Title -->
  <text x="600" y="520" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="38" font-weight="800">Can Stress Cause Jaw Pain?</text>
  <text x="600" y="570" text-anchor="middle" fill="#5eead4" font-family="system-ui,sans-serif" font-size="22" font-weight="600">The Mind-Jaw Connection Explained</text>
  <!-- Badge -->
  <rect x="30" y="30" width="180" height="36" rx="18" fill="#14b8a6" opacity="0.9"/>
  <text x="120" y="54" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">JAW PAIN GUIDE</text>
</svg>